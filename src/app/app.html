<button class="menu-btn" [class.hidden]="nav.menuOpen()" aria-label="Open menu" (click)="nav.toggleMenu()">
  <mat-icon>menu</mat-icon>
</button>
<app-sidebar class="shell-sidebar" [class.open]="nav.menuOpen()" />
@if (nav.menuOpen()) {
  <div class="scrim" (click)="nav.closeMenu()"></div>
}
<main class="shell-content">
  @if (nav.section() === 'downloads') {
    <app-downloads />
  } @else if (nav.section() === 'settings') {
    <app-settings />
  } @else {
    <app-library />
  }
</main>
<app-player-bar class="shell-player" />

@if (nav.nowPlaying()) {
  <app-now-playing />
}

@if (dragging()) {
  <div class="drop-overlay">
    <div class="drop-card">
      <mat-icon>library_music</mat-icon>
      <p class="drop-title">Add to Library</p>
      <p class="drop-sub">Drop audio files anywhere to import them</p>
    </div>
  </div>
}
